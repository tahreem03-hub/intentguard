<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntentGuard</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background-color: #f0f2f5;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #1f2328;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.875rem;
      font-size: 0.95rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      color: #1f2328;
      background-color: #f9fafb;
    }

    input[type="text"]:focus {
      border-color: #3b82d4;
      background-color: #ffffff;
    }

    button {
      padding: 0.6rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      background-color: #3b82d4;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s;
      white-space: nowrap;
    }

    button:hover {
      background-color: #2f6dbf;
    }

    button:active {
      background-color: #2560a8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IntentGuard</h1>
    <div class="input-row">
      <input type="text" placeholder="Enter your query…" />
      <button type="button">Submit</button>
    </div>
  </div>
</body>
</html>
